const wibT=(ts)=>new Date(ts*1000+7*3600e3).toISOString().slice(11,16);
function deriveAgents(d){const p=d.positions[0]; const m=new Date(Date.now()+7*3600e3).getUTCMinutes();
 return NOBI_DATA.agents.map(a=>{const x={...a};

  if(a.name==='Radar'){const near=p&&(p.pnlPct<=-2||!p.inRange||p.binsFromEdge<=3);x.status=near?'checking limits':'idle';x.note=near?'dekat batas!':'aman';}

  if(a.name==='Reporter'){x.status=(m>=28&&m<=33)?'live':'sleeping';x.note='lapor tiap :30';}
  return x;});}
function apply(r){const ps=r.positions.map(p=>({pool:p.pool,pubkey:(p.pubkey||'').slice(0,4)+'…'+(p.pubkey||'').slice(-3),opened:'-',depositSol:p.deposit||0,valueSol:p.value||0,pnlSol:p.pnlSol||0,pnlPct:p.pnlPct||0,inRange:p.inRange!==false,binsFromEdge:p.binsFromEdge??'-',tp:p.tp,sl:p.sl}));
 const cl=r.trades.filter(t=>t.result!=null); const pd=r.pnlDay||{};
 const act=[]; ps.forEach(p=>act.push({t:wibT(r.ts),who:'Exec',msg:p.pool+' '+(p.pnlPct>=0?'+':'')+p.pnlPct.toFixed(2)+'%, '+(p.inRange?'dalam rentang':'LUAR rentang')+' ('+p.binsFromEdge+' bin)'}));
 r.paper.open.forEach(p=>act.push({t:p.since,who:'Quant',msg:'Paper '+p.pool+' '+(p.pct!=null?p.pct.toFixed(2)+'%':'')}));
 r.paper.closed.slice(-4).reverse().forEach(p=>act.push({t:p.exit,who:'Quant',msg:'Paper tutup '+p.pool+' '+(p.pct!=null?p.pct.toFixed(2)+'%':'')+' ('+p.reason+')'}));
 r.trades.slice(-8).reverse().forEach(t=>act.push({t:t.opened,who:'Exec',msg:'#'+t.n+' '+t.pool+' '+t.size+' → '+(t.result!=null?(t.approx?'~':'')+t.result:'jalan')+' '+(t.reason||'')}));
 const d={...NOBI_DATA,updatedWib:'diperbarui '+new Date(r.ts*1000+7*3600e3).toISOString().slice(11,19)+' WIB',solUsd:r.solPrice||NOBI_DATA.solUsd,startSol:r.startSol,

 d.agents=deriveAgents({...d,paper:r.paper}); D=d;}
async function load(){const t=Date.now();let r=null;
 for(const u of['https://raw.githubusercontent.com/Nobitangapak/nobi-lp/main/data.json?t='+t,'./data.json?t='+t]){try{const res=await fetch(u,{cache:'no-store'});if(res.ok){r=await res.json();break;}}catch(e){}}
 if(r){apply(r);const age=Date.now()/1000-r.ts;ERR=age>300?'⚠ Data lama ('+Math.round(age/60)+' menit) – loop update mungkin berhenti':'';}else ERR='Gagal memuat data';
 window.__force&&window.__force();}
load(); setInterval(load,30000); setInterval(()=>window.__force&&window.__force(),1000);

@keyframes pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}

@keyframes spin{to{transform:translate(-50%,-50%) rotateX(62deg) rotateZ(360deg)}}
@keyframes flash{0%{background:rgba(74,222,128,.25)}100%{background:transparent}}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.nb *{box-sizing:border-box}
.nb button{cursor:pointer}
`;

function Panel({ title, children }) {
  return <div style={{ border: '1px solid rgba(34,211,238,.35)', borderRadius: 10, background: 'rgba(8,15,35,.85)', padding: 10, marginBottom: 10, boxShadow: '0 0 14px rgba(34,211,238,.12)' }}>

}
const Row = ({ k, v, c }) => <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, padding: '2px 0' }}><span style={{ color: '#94a3b8' }}>{k}</span><span style={{ color: c || '#e2e8f0', fontFamily: 'monospace' }}>{v}</span></div>;

function useNow() { return new Date(); }
function countdown(now, h) {
  const wib = new Date(now.getTime() + 7 * 3600e3); const sec = wib.getUTCHours() * 3600 + wib.getUTCMinutes() * 60 + wib.getUTCSeconds();
  const left = h * 3600 - (sec % (h * 3600)); const p = (x) => String(x).padStart(2, '0');
  return `${p(Math.floor(left / 3600))}:${p(Math.floor(left % 3600 / 60))}:${p(left % 60)}`;
}
